<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ShopEase</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Animated Border -->
    <div class="animated-border"></div>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            🛍️ ShopEase
        </div>

        <nav>
            <a href="index.html">Home</a>

            <a href="cart.html">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>
        </nav>

    </header>


    <!-- Login Page -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                🔐
            </div>

            <p class="auth-small-title">
                WELCOME BACK
            </p>

            <h1>
                Login
            </h1>

            <p class="auth-subtitle">
                Sign in to continue shopping with ShopEase.
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button">
                    Login →
                </button>

            </form>


            <p
                id="loginMessage"
                class="auth-message">
            </p>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-bottom-text">

                New to ShopEase?

                <a href="register.html">
                    Create an account
                </a>

            </p>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
